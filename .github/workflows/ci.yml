name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check design docs
        run: |
          test -f docs/design.md
          test -f docs/FEATURES.md
          test -f configs/examples/gaming-clips.yaml
        shell: bash

      - name: Build
        if: hashFiles('Cargo.toml') != ''
        run: cargo build --workspace

      - name: Test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace

      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check

  coverage:
    name: Coverage gate (core/catalog/engine ≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-llvm-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-llvm-cov-

      - name: Coverage
        if: hashFiles('Cargo.toml') != ''
        run: cargo llvm-cov -p portage-core -p portage-catalog -p portage-engine --fail-under-lines 80 --summary-only
